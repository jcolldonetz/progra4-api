openapi: 3.0.3
info:
  title: API de Items — Ejemplo didáctico (Programación 4)
  description: |
    API REST en PHP puro con CRUD para las entidades **Item** (`id`, `nombre`,
    `precio`, `categoria_id`) y **Categoria** (`id`, `nombre`), relacionadas 1:N:
    cada item pertenece a una categoría (opcional) y cada categoría agrupa N items.

    Capas: **Controlador** → **Servicio** (validaciones y reglas de negocio) →
    **Repositorio** (interfaces `ItemRepositoryInterface` y
    `CategoriaRepositoryInterface`) con dos implementaciones intercambiables
    vía PDO + SQLite:
    - `sqlite`: archivo persistente en `data/items.sqlite` (default)
    - `memory`: base de datos en RAM (`sqlite::memory:`)

    Para usar la implementación en memoria, iniciar el servidor así:
    `$env:REPOSITORY_DRIVER='memory'; php -S localhost:8000 -t public`

    ## Autenticación JWT

    1. Hacer `POST /login` con `{"username": "admin", "password": "qwerty67"}` → devuelve un **JWT** firmado (HS256, vigencia 1 h). En la base de datos solo se guarda el hash bcrypt de la contraseña.
    2. Enviar el encabezado `Authorization: Bearer <token>` en todos los endpoints de `/items` y `/categorias`. Sin token válido se responde **401**.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Servidor HTTP (php -S localhost:8000 -t public)
  - url: https://localhost:8443
    description: Servidor HTTPS (serve-https.cmd — certificado autofirmado)

# La API es pública: sin autenticación.
security: []

tags:
  - name: Auth
    description: Autenticación (pública)
  - name: Items
    description: CRUD de la entidad Item (requiere JWT Bearer)
  - name: Categorias
    description: CRUD de la entidad Categoria y su relación 1:N con Item (requiere JWT Bearer)

paths:
  /login:
    post:
      tags: [Auth]
      operationId: iniciarSesion
      summary: Autenticarse y obtener un JWT
      security: []
      description: |
        Valida las credenciales contra la tabla `users` de la base de datos.
        La contraseña se verifica contra su **hash bcrypt** (`password_verify`),
        nunca contra texto plano. Devuelve un token HS256 con claims
        `sub`, `username`, `iat` y `exp`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: 'qwerty67'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              example:
                error: Credenciales inválidas.
        '422':
          description: Faltan campos obligatorios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: La solicitud contiene datos inválidos.
                errors:
                  password: ['La contraseña es obligatoria.']

  /items:
    get:
      tags: [Items]
      security:
        - bearerAuth: []
      operationId: listarItems
      summary: Listar todos los items
      responses:
        '200':
          description: Lista completa de items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
              example:
                - { id: 1, nombre: 'Teclado mecanico', precio: 25.5, categoria_id: null }
                - { id: 2, nombre: 'Mouse inalambrico', precio: 15.9, categoria_id: null }
                - { id: 3, nombre: 'Monitor 24"', precio: 189.99, categoria_id: null }

    post:
      tags: [Items]
      security:
        - bearerAuth: []
      operationId: crearItem
      summary: Crear un item
      description: |
        Valida los datos (nombre obligatorio de 1 a 100 caracteres, precio numérico >= 0)
        y aplica la regla de negocio de nombre único (sin distinguir mayúsculas/minúsculas).
        Opcional: `categoria_id` (debe existir) para asociar el item a una categoría.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
            example:
              nombre: Lampara LED
              precio: 12.5
              categoria_id: 4
      responses:
        '201':
          description: Item creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                id: 4
                nombre: Lampara LED
                precio: 12.5
                categoria_id: 4
        '422':
          description: Datos inválidos o nombre duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                camposInvalidos:
                  summary: Varios campos inválidos
                  value:
                    error: La solicitud contiene datos inválidos.
                    errors:
                      nombre: ['El nombre es obligatorio.']
                      precio: ['El precio no puede ser negativo.']
                nombreDuplicado:
                  summary: Regla de nombre único
                  value:
                    error: La solicitud contiene datos inválidos.
                    errors:
                      nombre: ["Ya existe un item con el nombre 'TECLADO MECANICO'."]
                cuerpoNoJson:
                  summary: Cuerpo no es JSON válido
                  value:
                    error: La solicitud contiene datos inválidos.
                    errors:
                      body: ['Se esperaba un objeto JSON válido.']

  /items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'

    get:
      tags: [Items]
      security:
        - bearerAuth: []
      operationId: obtenerItem
      summary: Obtener un item por id
      responses:
        '200':
          description: Item encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                id: 1
                nombre: Teclado mecanico
                precio: 25.5
                categoria_id: null
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: El id no es un entero positivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: La solicitud contiene datos inválidos.
                errors:
                  id: ['El identificador debe ser un entero positivo.']

    put:
      tags: [Items]
      security:
        - bearerAuth: []
      operationId: actualizarItem
      summary: Reemplazar un item por id
      description: 'Actualización completa (PUT): se envían nombre, precio y, opcionalmente, categoria_id.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
            example:
              nombre: Lampara LED RGB
              precio: 19.99
              categoria_id: null
      responses:
        '200':
          description: Item actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                id: 4
                nombre: Lampara LED RGB
                precio: 19.99
                categoria_id: null
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: Datos inválidos o nombre usado por otro item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

    delete:
      tags: [Items]
      security:
        - bearerAuth: []
      operationId: eliminarItem
      summary: Eliminar un item por id
      responses:
        '204':
          description: Eliminado (sin cuerpo)
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: El id no es un entero positivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /categorias:
    get:
      tags: [Categorias]
      security:
        - bearerAuth: []
      operationId: listarCategorias
      summary: Listar todas las categorías con su conteo de items
      description: |
        Cada categoría incluye un `items_count` (lado "1" de la relación 1:N):
        cuántos items le pertenecen.
      responses:
        '200':
          description: Lista completa de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
              example:
                - { id: 1, nombre: 'Monitores', items_count: 137 }
                - { id: 2, nombre: 'Auriculares', items_count: 119 }

    post:
      tags: [Categorias]
      security:
        - bearerAuth: []
      operationId: crearCategoria
      summary: Crear una categoría
      description: |
        Valida el nombre (obligatorio, 1 a 100 caracteres, único sin distinguir
        mayúsculas/minúsculas).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
            example:
              nombre: Redes
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
              example:
                id: 9
                nombre: Redes
                items_count: 0
        '422':
          description: Datos inválidos o nombre duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: La solicitud contiene datos inválidos.
                errors:
                  nombre: ["Ya existe una categoria con el nombre 'Redes'."]

  /categorias/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoriaId'

    get:
      tags: [Categorias]
      security:
        - bearerAuth: []
      operationId: obtenerCategoria
      summary: Obtener una categoría por id
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
              example:
                id: 1
                nombre: Monitores
                items_count: 137
        '404':
          description: La categoría no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              example:
                error: No existe la categoria con id 999.
        '422':
          $ref: '#/components/responses/IdInvalido'

    put:
      tags: [Categorias]
      security:
        - bearerAuth: []
      operationId: actualizarCategoria
      summary: Reemplazar una categoría por id
      description: 'Actualización completa (PUT): se envía el nombre.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
            example:
              nombre: Periféricos y accesorios
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
              example:
                id: 2
                nombre: Periféricos y accesorios
                items_count: 48
        '404':
          description: La categoría no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          $ref: '#/components/responses/IdInvalido'

    delete:
      tags: [Categorias]
      security:
        - bearerAuth: []
      operationId: eliminarCategoria
      summary: Eliminar una categoría por id
      description: |
        Solo se puede eliminar si no tiene items asociados. Si los tiene,
        responde **422** (integridad referencial a nivel de negocio).
      responses:
        '204':
          description: Eliminada (sin cuerpo)
        '404':
          description: La categoría no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: La categoría tiene items asociados o el id no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                idInvalido:
                  summary: El id no es un entero positivo
                  value:
                    error: La solicitud contiene datos inválidos.
                    errors:
                      id: ['El identificador debe ser un entero positivo.']
                conItems:
                  summary: La categoría no está vacía
                  value:
                    error: La solicitud contiene datos inválidos.
                    errors:
                      categoria_id: ['No se puede eliminar la categoria: tiene items asociados.']

  /categorias/{id}/items:
    parameters:
      - $ref: '#/components/parameters/CategoriaId'

    get:
      tags: [Categorias]
      security:
        - bearerAuth: []
      operationId: listarItemsDeCategoria
      summary: Listar los items de una categoría (lado "N" de la relación)
      responses:
        '200':
          description: Items que pertenecen a la categoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
              example:
                - { id: 12, nombre: 'Monitores LG 27GL850-B 27" Nano IPS', precio: 549.99, categoria_id: 1 }
                - { id: 34, nombre: 'Monitores Dell U2723QE 27" 4K IPS Black', precio: 699.0, categoria_id: 1 }
        '404':
          description: La categoría no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          $ref: '#/components/responses/IdInvalido'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT emitido por POST /login. En Postman: pestaña Authorization -> Bearer Token.'

  parameters:
    ItemId:
      name: id
      in: path
      required: true
      description: Identificador numérico del item
      schema:
        type: integer
        minimum: 1
      example: 1

    CategoriaId:
      name: id
      in: path
      required: true
      description: Identificador numérico de la categoría
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    NoEncontrado:
      description: El item no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
          example:
            error: No existe el item con id 999.

    IdInvalido:
      description: El id no es un entero positivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error: La solicitud contiene datos inválidos.
            errors:
              id: ['El identificador debe ser un entero positivo.']

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          writeOnly: true
          example: 'qwerty67'

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT firmado (HS256) para usar como Bearer token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhcGktaXRlbXMiLCJpYXQiOjE3ODc2MDc0MDgsImV4cCI6MTc4NzYxMTAwOCwic3ViIjoxLCJ1c2VybmFtZSI6ImFkbWluIn0.fxsAz_kdrep5QQwh9vX_KISrEbLYdE_r2qjGyLZzOII
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Vigencia del token en segundos
          example: 3600
        user:
          type: object
          properties:
            id:
              type: integer
              example: 1
            username:
              type: string
              example: admin

    Item:
      type: object
      required: [id, nombre, precio]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          maxLength: 100
          example: Teclado mecanico
        precio:
          type: number
          format: double
          minimum: 0
          example: 25.5
        categoria_id:
          type: integer
          nullable: true
          minimum: 1
          description: Categoría a la que pertenece (relación 1:N; null si no tiene)
          example: 4

    ItemInput:
      type: object
      required: [nombre, precio]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          example: Lampara LED
        precio:
          type: number
          format: double
          minimum: 0
          example: 12.5
        categoria_id:
          type: integer
          nullable: true
          minimum: 1
          description: Debe referenciar una categoría existente para ser válido
          example: 4

    Categoria:
      type: object
      required: [id, nombre, items_count]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          maxLength: 100
          example: Monitores
        items_count:
          type: integer
          minimum: 0
          description: Cuántos items pertenecen a la categoría (lado "1" de la relación 1:N)
          example: 137

    CategoriaInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          example: Redes

    NotFoundError:
      type: object
      properties:
        error:
          type: string
          example: No existe el item con id 999.

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: La solicitud contiene datos inválidos.
        errors:
          type: object
          description: Mapa campo => lista de mensajes de validación
          additionalProperties:
            type: array
            items:
              type: string
          example:
            nombre: ['El nombre es obligatorio.']
            precio: ['El precio no puede ser negativo.']
